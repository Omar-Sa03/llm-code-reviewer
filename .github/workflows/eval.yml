name: Weekly Eval (Model Drift Detection)

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      prompt_version:
        description: "Prompt version to evaluate (v1 or v2)"
        required: false
        default: "v2"
      min_precision:
        description: "Minimum precision threshold (0.0–1.0)"
        required: false
        default: "0.70"

jobs:
  eval:
    name: Eval — ${{ github.event.inputs.prompt_version || 'v2' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run eval harness
        env:
          HF_TOKEN:    ${{ secrets.HF_TOKEN }}
          MODEL_NAME:  "Qwen/Qwen2.5-Coder-32B-Instruct"
          LLM_PROVIDER: "huggingface"
          GITHUB_TOKEN: "dummy"       # not used by eval harness
          GITHUB_REPOSITORY: "owner/repo"
          PR_NUMBER: "0"
        run: |
          python evals/run_eval.py \
            --prompt-version ${{ github.event.inputs.prompt_version || 'v2' }} \
            --min-precision ${{ github.event.inputs.min_precision || '0.70' }} \
            --output evals/results/latest_eval.json

      - name: Upload eval results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-${{ github.run_id }}
          path: evals/results/latest_eval.json
          retention-days: 90

      - name: Comment eval summary on workflow run
        if: always()
        run: |
          echo "## Eval Results" >> $GITHUB_STEP_SUMMARY
          cat evals/results/latest_eval.json | python3 -c "
          import json, sys
          r = json.load(sys.stdin)
          if r.get('overall_precision') is not None:
              print(f'| Metric | Value |')
              print(f'|--------|-------|')
              print(f'| Precision | {r[\"overall_precision\"]:.1%} |')
              print(f'| Recall    | {r[\"overall_recall\"]:.1%} |')
              print(f'| F1        | {r[\"overall_f1\"]:.1%} |')
              print(f'| Fixtures  | {r[\"fixture_count\"]} |')
              print(f'| Model     | {r[\"model\"]} |')
          else:
              print('Results not yet populated.')
          " >> $GITHUB_STEP_SUMMARY
