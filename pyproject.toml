[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-code-reviewer"
version = "1.0.0"
description = "Automated AI code review GitHub Action — posts inline PR comments for security issues, bugs, and performance problems."
readme = "Readme.md"
license = { text = "MIT" }
authors = [{ name = "Omar-Sa03" }]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "urllib3>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.urls]
Repository = "https://github.com/Omar-Sa03/llm-code-reviewer"

[tool.setuptools.packages.find]
include = ["reviewer*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]   # line length handled separately

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
no_strict_optional = true
